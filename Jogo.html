<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Tecnologia</title>
    <link rel="stylesheet" href="css/jogo.css">
</head>
<body>
    <header class="quiz-header">
        <h1 class="quiz-header__titulo">VAMOS COMECAR!</h1>
        <aside class="quiz-header__decoracao" aria-hidden="true">
            <img src="./img/Hatsune_Miku_V2.webp" alt="nega" class="quiz-header__decoracao-img" width="350" height="450" loading="eager" decoding="async">
        </aside>
        <div class="quiz-header__progresso" aria-live="polite">Pergunta <span id="progresso-atual">0</span> de <span id="progresso-total">15</span></div>
    </header>

    <main>
        <form id="quiz-form" aria-label="Quiz de tecnologia" novalidate>
            <div id="quiz-list" class="quiz-list"></div>
        </form>
    </main>

    <footer class="quiz-footer">
        <button type="button" id="btn-finalizar" class="quiz-footer__botao">Finalizar Quiz</button>
        <button type="button" id="btn-voltar" class="quiz-footer__botao">Voltar ao Inicio</button>
    </footer>

    <div id="modal-resultado-overlay" class="modal-overlay" aria-hidden="true">
        <div id="modal-resultado" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-resultado-titulo">
            <h2 id="modal-resultado-titulo" class="modal__titulo">Resultado</h2>
            <div id="result-content"></div>
            <div class="modal__acoes">
                <button type="button" id="btn-fechar-modal">Fechar</button>
                <button type="button" id="btn-reiniciar">Jogar Novamente</button>
            </div>
        </div>
    </div>

    <div id="modal-continuar-overlay" class="modal-overlay" aria-hidden="true">
        <div id="modal-continuar" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-continuar-titulo">
            <h2 id="modal-continuar-titulo" class="modal__titulo">Continuar de onde parou?</h2>
            <p>Encontramos um progresso salvo. Deseja continuar?</p>
            <div class="modal__acoes">
                <button type="button" id="btn-continuar">Continuar</button>
                <button type="button" id="btn-novo-quiz">Novo Quiz</button>
            </div>
        </div>
    </div>

    <script src="js/dados.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/jogo.js" defer></script>
</body>
</html>
